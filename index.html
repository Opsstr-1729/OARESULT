<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5774">
<title>Marks entry – Office Assistant test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--p:#0e5774;--pt:#fff;--bg:#f3f8fa;--s:#fff;--bd:#dbe6eb;--tx:#10303c;--mu:#58727e;--soft:#e6f0f4;--ok:#16825a;--okt:#fff;--bad:#c0392b;--badt:#fff;--r:16px}
@media(prefers-color-scheme:dark){:root{--p:#4fa8c7;--pt:#06222d;--bg:#0b1a21;--s:#12262f;--bd:#23404c;--tx:#e6f1f5;--mu:#93acb7;--soft:#1a3743;--ok:#3fbf8c;--okt:#04251a;--bad:#ff8a7a;--badt:#2a0a06}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
header{background:#0e5774;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
.hw,main{max-width:720px;margin:0 auto}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:13px;opacity:.88}
.pg{height:6px;border-radius:3px;background:#ffffff40;margin-top:10px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .4s}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--bd);background:var(--s);font-weight:500}
.chips button[aria-pressed=true]{background:var(--p);color:var(--pt);border-color:var(--p);font-weight:600}
input,textarea{font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
#fs{margin-bottom:10px}
.mut{color:var(--mu)}
#msg{background:color-mix(in srgb,var(--bad) 12%,var(--s));border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin:0 0 12px}
#msg:empty{display:none}
.nm{text-transform:lowercase;font-variant:small-caps;font-size:1.1em;font-weight:600}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;min-height:64px;transition:transform .1s}
.row:active{transform:scale(.99)}
.rl{font-weight:700;color:var(--p);min-width:46px}
.row .nm,.tc .nm{display:block;overflow-wrap:anywhere}
small{color:var(--mu);font-size:13px}
.st{font-size:13px;color:var(--mu)}
.st.done{background:var(--soft);color:var(--ok);font-weight:700;font-size:17px;padding:4px 12px;border-radius:12px}
#bn{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),360px);display:flex;gap:4px;padding:6px;background:color-mix(in srgb,var(--s) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:30px;box-shadow:0 8px 28px #0a2a3a33;z-index:6}
#bn button{flex:1;border:0;background:none;border-radius:24px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mu)}
#bn button[aria-current=page]{background:var(--p);color:var(--pt)}
#bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.th p{margin:0}
.btn{min-height:50px;border-radius:14px;font-weight:700;border:1.5px solid var(--p);padding:0 16px;background:var(--s);color:var(--p)}
.btn.p{background:var(--p);color:var(--pt)}
.btn.sm{min-height:40px;border-radius:20px;font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
.tc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:8px}
.tc.top{border-color:var(--p);box-shadow:inset 4px 0 0 var(--p)}
.rk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--p);font-weight:700}
.top .rk{background:var(--p);color:var(--pt)}
.bk{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bk span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--mu)}
.sc{font-size:26px;font-weight:700;color:var(--p);text-align:right;line-height:1}
.sc small{display:block;margin-top:2px}
.ov{position:fixed;inset:0;background:#06202c99;display:flex;align-items:flex-end;justify-content:center;z-index:10;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.on{opacity:1;visibility:visible}
.sheet{background:var(--s);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px 0;transform:translateY(32px);transition:transform .25s ease}
.ov.on .sheet{transform:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 12px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hd .nm{font-size:1.3em;display:block}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:18px;flex:none}
h4{margin:18px 0 8px;font-size:16px}
h4 small{font-weight:400}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.t{min-height:52px;border-radius:14px;border:1.5px solid var(--bd);background:var(--s);font-weight:600;transition:background .15s}
.t[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--okt)}
.t[aria-pressed=true]::before{content:"✓ "}
.t[data-s="1"]{background:var(--ok);border-color:var(--ok);color:var(--okt)}
.t[data-s="1"]::before{content:"✓ "}
.t[data-s="-1"]{background:var(--bad);border-color:var(--bad);color:var(--badt)}
.t[data-s="-1"]::before{content:"✗ "}
.hint{margin:-2px 0 8px;font-size:13px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label,.rm{display:block;color:var(--mu);font-size:13px}
.two input,.rm input,.rm textarea{margin-top:4px;font-size:17px}
.ft{position:sticky;bottom:0;background:var(--s);display:grid;grid-template-columns:auto 1fr 1.3fr;gap:10px;align-items:center;padding:12px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);margin-top:16px}
.sum{line-height:1.1}.sum b{font-size:30px;color:var(--p)}
#err{color:var(--bad);margin:8px 0 0;min-height:1.3em}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#10303c;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,#bn,.chips,.ov,#toast,.btn,#fs{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header><div class="hw">
  <h1>Marks entry</h1>
  <p>Office Assistant screening test</p>
  <div class="pg"><i id="pgb"></i></div>
  <p id="pgt" style="margin-top:6px">Loading…</p>
</div></header>
<main>
  <p id="msg" role="alert"></p>

  <section id="v1">
    <input id="fs" type="search" placeholder="Search roll number or name" autocomplete="off" aria-label="Search candidates">
    <div class="chips" data-k="fb" aria-label="Batch">
      <button data-v="" aria-pressed="true">All</button><button data-v="A" aria-pressed="false">Batch A</button><button data-v="B" aria-pressed="false">Batch B</button><button data-v="C" aria-pressed="false">Batch C</button><button data-v="D" aria-pressed="false">Batch D</button><button data-v="E" aria-pressed="false">Batch E</button><button id="fp" aria-pressed="false">Pending only</button>
    </div>
    <p id="stat" class="mut"></p>
    <div id="list"><p class="mut">Loading candidates…</p></div>
  </section>

  <section id="v2" hidden>
    <div class="chips" data-k="tb" aria-label="Batch">
      <button data-v="" aria-pressed="true">All batches</button><button data-v="A" aria-pressed="false">A</button><button data-v="B" aria-pressed="false">B</button><button data-v="C" aria-pressed="false">C</button><button data-v="D" aria-pressed="false">D</button><button data-v="E" aria-pressed="false">E</button>
    </div>
    <div class="chips" data-k="tn" aria-label="How many">
      <button data-v="10" aria-pressed="true">Top 10</button><button data-v="20" aria-pressed="false">Top 20</button><button data-v="50" aria-pressed="false">Top 50</button><button data-v="0" aria-pressed="false">Everyone</button>
    </div>
    <div class="th"><p id="tstat" class="mut"></p><button class="btn sm" id="pr">Print</button></div>
    <div id="top"></div>
  </section>
</main>

<nav id="bn" aria-label="Pages">
  <button id="n1" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Evaluate</button>
  <button id="n2"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>Toppers</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Enter marks"></div></div>
<div id="toast" role="status"></div>

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRw_c7amne28qxnf8XyNkw9zwEbL_Fd08JKRJCdtW2NSeyNPJBasf07VZJyDnJiiM7GJFmYzvZ5k26e/pub?gid=0&single=true&output=csv';
const SU='https://script.google.com/macros/s/AKfycbzanYlaUIu0dwI_GqCgYTBbCHUYd9LtkqHVRM7RZ-INSgbJtRMeGim1sbuVE19aKlrJ/exec';
let rows=[],cur=null,S=null,live=false,loaded=false;
const F={fb:'',tb:'',tn:'10',fp:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const r2=x=>Math.round(x*100)/100;
let tmr;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),2400)}

function parseCSV(t){const o=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'){r.push(f);o.push(r);r=[];f=''}else if(c!='\r')f+=c}
  if(f||r.length){r.push(f);o.push(r)}return o}

async function load(){
  $('#msg').textContent='';live=false;let why='';
  try{
    const res=await fetch(SU+'?t='+Date.now());
    const t=await res.text();let j;
    try{j=JSON.parse(t)}catch(e){throw new Error(t.trim().charAt(0)=='<'?'The script returned a web page, not data. In Apps Script, set “Who has access” to Anyone and deploy a new version.':'The script did not return marks data. It may be a different script.')}
    if(!j.rows)throw new Error('The script has no marks data. Paste Code.gs into the same Apps Script project and deploy a new version.');
    rows=j.rows.map(r=>({roll:String(r.roll),name:r.name,batch:r.batch,status:r.status,
      q:r.q.map(num),spell:num(r.spell)||0,remarks:r.remarks||'',total:num(r.total)}));
    live=true;loaded=true;render();return;
  }catch(e){why=e.message=='Failed to fetch'?'The browser could not reach the script. In Apps Script, set “Who has access” to Anyone and deploy a new version.':e.message}
  try{
    const t=await (await fetch(CSV_URL+'&t='+Date.now())).text();
    rows=parseCSV(t).slice(1).filter(r=>r[0]).map(r=>({roll:r[0],name:r[1],batch:r[2],status:r[4],
      q:Array(11).fill(null),spell:0,remarks:'',total:null}));
    $('#msg').textContent=why+' The list is read-only until this is fixed.';
  }catch(e){$('#msg').textContent=why+' The candidate list could not be loaded either.'}
  loaded=true;render();
}

function calc(q,sp){
  const obj=q.slice(0,10).reduce((a,b)=>a+(b||0),0);
  const d=Math.floor((sp||0)/4);
  const q11=q[10]||0;
  return{obj:r2(obj),q11:r2(q11),d:d,total:r2(obj+q11-d)};
}

function visible(){
  const s=$('#fs').value.trim().toLowerCase();
  return rows.filter(r=>(!F.fb||r.batch==F.fb)&&(!s||r.roll.includes(s)||String(r.name).toLowerCase().includes(s))&&(!F.fp||r.total==null));
}

function renderEval(){
  const L=visible();
  $('#stat').textContent='Showing '+L.length+' of '+rows.length+' candidates';
  $('#list').innerHTML=L.map(r=>'<button class="row" data-r="'+esc(r.roll)+'"><span class="rl">'+esc(r.roll)+'</span><span><span class="nm">'+esc(r.name)+'</span><small>Batch '+esc(r.batch)+(r.status=='Present'?'':', not marked present')+'</small></span>'+
    (r.total!=null?'<span class="st done">'+r.total+'</span>':'<span class="st">Pending</span>')+'</button>').join('')||'<p class="mut">'+(loaded?'No candidates match.':'Loading candidates…')+'</p>';
}

function renderTop(){
  const n=+F.tn;
  const L=rows.filter(r=>r.total!=null&&(!F.tb||r.batch==F.tb)).sort((x,y)=>y.total-x.total||(y.q[10]||0)-(x.q[10]||0)||x.roll-y.roll);
  let rk=0,prev=null;
  const R=L.map((r,i)=>{if(r.total!==prev){rk=i+1;prev=r.total}return{r:r,rk:rk}});
  const T=n?R.filter(x=>x.rk<=n):R;
  $('#tstat').textContent=T.length+' of '+L.length+' evaluated. Equal totals share a rank.';
  $('#top').innerHTML=T.map(x=>{const c=calc(x.r.q,x.r.spell);
    return'<div class="tc'+(x.rk<=3?' top':'')+'"><span class="rk">'+x.rk+'</span><div><span class="nm">'+esc(x.r.name)+'</span><small>Roll '+esc(x.r.roll)+', batch '+esc(x.r.batch)+'</small><div class="bk"><span>Q1–10: '+c.obj+' of 10</span><span>Q11: '+c.q11+' of 15</span>'+(c.d?'<span>Spelling: −'+c.d+'</span>':'')+'</div></div><div class="sc">'+x.r.total+'<small>of 25</small></div></div>'}).join('')||'<p class="mut">No evaluated candidates yet.</p>';
}

function render(){
  const done=rows.filter(r=>r.total!=null).length;
  $('#pgt').textContent=done+' of '+rows.length+' evaluated';
  $('#pgb').style.width=(rows.length?done/rows.length*100:0)+'%';
  renderEval();renderTop();
}

function show(v){
  $('#v1').hidden=v!=1;$('#v2').hidden=v!=2;
  $('#n1').setAttribute('aria-current',v==1?'page':'false');
  $('#n2').setAttribute('aria-current',v==2?'page':'false');
  location.hash=v==1?'evaluate':'toppers';scrollTo(0,0);
}

function openForm(roll){
  cur=rows.find(r=>r.roll==roll);if(!cur)return;
  const n1=Math.round((cur.q[0]||0)*4);
  S={a:[0,1,2,3].map(i=>i<n1),m:[1,2,3,4,5,6,7,8,9].map(i=>{const v=cur.q[i]||0;return v>=1?1:v<=-1?-1:0}),q11:cur.q[10]==null?'':cur.q[10],sp:cur.spell||0,rem:cur.remarks||''};
  $('#sheet').innerHTML=
   '<div class="grab"></div><div class="hd"><div><span class="nm">'+esc(cur.name)+'</span><small>Roll '+esc(cur.roll)+', batch '+esc(cur.batch)+'</small></div><button class="x" id="x" aria-label="Close">✕</button></div>'+
   '<h4>Q1 spelling pairs <small>¼ mark per correct pair, <span id="s1">0</span> of 1</small></h4><div class="tg">'+
   [0,1,2,3].map(i=>'<button class="t" data-a="'+i+'" aria-pressed="'+S.a[i]+'">Pair '+(i+1)+'</button>').join('')+'</div>'+
   '<h4>Q2 to Q10 <small id="s2"></small></h4><p class="hint">Tap once for correct (+1), twice for wrong (−1), three times to clear.</p><div class="tg">'+
   S.m.map((v,i)=>'<button class="t" data-m="'+i+'" data-s="'+v+'" aria-label="Q'+(i+2)+'">Q'+(i+2)+'</button>').join('')+'</div>'+
   '<h4>Q11 application letter <small>out of 15</small></h4>'+
   '<label class="rm">Marks<input id="q11" type="number" min="0" max="15" step="0.5" inputmode="decimal" value="'+S.q11+'"></label>'+
   '<h4>Spelling errors <small>whole paper, 1 mark off for every 4</small></h4>'+
   '<label class="rm">Number of spelling errors<input id="sp" type="number" min="0" step="1" inputmode="numeric" value="'+S.sp+'"></label>'+
   '<p id="ded" class="mut"></p>'+
   '<label class="rm">Remarks<textarea id="rem" rows="2">'+esc(S.rem)+'</textarea></label><p id="err"></p>'+
   '<div class="ft"><div class="sum"><b id="tt">0</b><small> of 25</small></div><button class="btn" id="sv">Save</button><button class="btn p" id="sn">Save and next</button></div>';
  $('#ov').classList.add('on');upd();
}
function closeForm(){$('#ov').classList.remove('on');cur=null}

function qs(){
  const q11=S.q11===''?0:Math.min(15,Math.max(0,S.q11));
  return[S.a.filter(Boolean).length/4].concat(S.m,[q11]);
}
function upd(){
  const q=qs(),c=calc(q,S.sp);
  $('#s1').textContent=q[0];$('#s2').textContent=S.m.filter(v=>v>0).length+' right, '+S.m.filter(v=>v<0).length+' wrong';
  $('#ded').textContent=c.d?('Spelling errors take '+c.d+' mark'+(c.d>1?'s':'')+' off the total (1 per 4 errors).'):'No deduction yet. 1 mark comes off for every 4 spelling errors.';
  $('#tt').textContent=c.total;
}

async function save(next){
  if(!live){$('#err').textContent='Marks can’t be saved until the page connects to the script. See the message at the top of the page.';return}
  const q=qs(),c=calc(q,S.sp),roll=cur.roll,nm=cur.name;
  const body={roll:roll,q:q,spell:S.sp||0,remarks:S.rem.trim(),total:c.total};
  const L=visible(),i=L.findIndex(r=>r.roll==roll);
  $('#sv').disabled=$('#sn').disabled=true;$('#err').textContent='Saving…';
  try{
    const res=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Save failed');
  }catch(e){
    await load();
    const r=rows.find(x=>x.roll==roll);
    if(!(r&&r.total===c.total)){cur=r||null;$('#err').textContent='Could not confirm the save. Check your connection and try again.';$('#sv').disabled=$('#sn').disabled=false;return}
  }
  const r=rows.find(x=>x.roll==roll);
  Object.assign(r,{q:q,spell:body.spell,remarks:body.remarks,total:c.total});
  render();toast('Saved '+c.total+' of 25 for '+nm.toLowerCase());
  if(next){const n=L.slice(i+1).find(x=>x.total==null)||L.find(x=>x.total==null&&x.roll!=roll);n?openForm(n.roll):closeForm()}
  else closeForm();
}

$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openForm(r.dataset.r)});
$('#sheet').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id=='x')return closeForm();
  if(t.dataset.a!=null){const i=+t.dataset.a;S.a[i]=!S.a[i];t.setAttribute('aria-pressed',S.a[i]);upd()}
  else if(t.dataset.m!=null){const i=+t.dataset.m,v=S.m[i];S.m[i]=v==0?1:v==1?-1:0;t.dataset.s=S.m[i];upd()}
  else if(t.id=='sv')save(false);
  else if(t.id=='sn')save(true);
});
$('#sheet').addEventListener('input',e=>{
  if(e.target.id=='q11'){S.q11=e.target.value===''?'':Number(e.target.value)}
  else if(e.target.id=='sp'){S.sp=Math.max(0,parseInt(e.target.value)||0)}
  else if(e.target.id=='rem'){S.rem=e.target.value}
  upd();
});
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')closeForm()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeForm()});
document.addEventListener('click',e=>{
  const b=e.target.closest('.chips button');if(!b)return;
